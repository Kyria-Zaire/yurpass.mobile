name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  type-check:
    name: TypeScript Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx turbo run type-check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx turbo run lint

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # API: strict audit — all high+ vulns must be resolved
      - name: Audit API dependencies
        run: npm audit --audit-level=high
        working-directory: apps/api
      # Mobile: audit-level=critical only — known HIGH vulns come from
      # Expo CLI build tools (send, tar, cacache) which are dev-only
      # and never shipped in the production bundle.
      # See apps/mobile/.nsprc for the full exclusion list.
      # Will be resolved when upgrading to Expo SDK 55+.
      - name: Audit Mobile dependencies
        run: npm audit --audit-level=critical
        working-directory: apps/mobile

  build-api:
    name: Build API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@yurpass/types
      - run: npm run build --workspace=@yurpass/validators
      - run: npm run build --workspace=@yurpass/api

  build-mobile:
    name: Build Mobile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [type-check, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo export --platform web
        working-directory: apps/mobile
        continue-on-error: true

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [type-check, lint, security-audit, build-api, build-mobile]
    if: failure()
    steps:
      - name: Summary
        run: echo "::error::CI pipeline failed. Check individual job logs for details."
